; Gravador OBD do comboio: ESP32 (classico) <-> ELM327 por Bluetooth classico,
; fila em LittleFS e envio para Azure Blob (append blob) pelo Wi-Fi da Starlink.
; Compilar:  python -m platformio run
; Gravar:    python -m platformio run -t upload --upload-port COM9
; Serial:    python -m platformio device monitor --port COM9
[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
lib_deps =
    ; (sem bibliotecas externas)
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_SPP_ENABLED=1

[env:sim]
; Mesmo firmware sem carro: gera leituras falsas para testar Wi-Fi e envio.
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSIM_OBD=1

[env:bancada]
; Firmware real com envio a cada 30 s, para testar a pausa do BT na mesa.
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DUPLOAD_EVERY_S=30

[env:amarok_sweep]
; Firmware normal da Amarok que, uma vez por gravacao, varre mode 01 (01..FF) e mode 09 (so leitura)
; antes de gravar e sobe tudo ao Azure. Plano B se a varredura pelo PC (sweep.py) nao der na parada.
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSWEEP_ON_CONNECT=1

[env:gpsprobe]
; Sonda do modulo GPS: acha pino/baud do NMEA e mostra o fix. Regravar o esp32dev depois.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../probe/gps_probe.cpp>
